<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok LIVE.IS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header><h1>TikTok LIVE.IS</h1><p>TikTok LIVE → YouTube</p></header>

  <details class="card" id="connectionCard">
    <summary>Acceso — <span id="connectionState">Sin configurar</span></summary>
    <label>Token de acceso <input id="token" type="password" placeholder="Pega aquí tu token"></label>
    <button id="saveConnection">Guardar en este navegador</button>
    <p class="hint">Se guarda solo en este dispositivo, nunca se publica ni se comparte.</p>
  </details>

  <section class="card">
    <h2>Nuevo trabajo</h2>
    <label>URL del TikTok LIVE
      <input id="tiktokLiveUrl" type="url" placeholder="https://www.tiktok.com/@usuario/live">
    </label>

    <div class="modes">
      <label><input type="radio" name="mode" value="simple" checked> Directo completo</label>
      <label><input type="radio" name="mode" value="chunked"> Por partes</label>
    </div>

    <label id="chunkWrap">Minutos por parte
      <input id="chunkMinutes" type="number" min="5" max="60" value="5">
    </label>

    <label>Título <input id="title" placeholder="TikTok LIVE"></label>
    <label>Descripción <textarea id="description"></textarea></label>

    <label>Visibilidad
      <select id="privacy">
        <option value="unlisted">Oculto</option>
        <option value="public">Público</option>
        <option value="scheduled">Programado</option>
      </select>
    </label>

    <label id="scheduleWrap">Fecha y hora
      <input id="scheduledAt" type="datetime-local">
    </label>

    <button id="start">⏺ Grabar y subir</button>
    <p id="status">Listo.</p>
    <div id="runInfo"></div>
  </section>

  <section class="card">
    <h2>Resultados</h2>
    <div id="results">Aún no hay resultados.</div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
