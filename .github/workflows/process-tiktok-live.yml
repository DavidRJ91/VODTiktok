name: Process TikTok LIVE

on:
  workflow_dispatch:
    inputs:
      tiktok_url:
        description: "URL del TikTok LIVE"
        required: true
        type: string
      mode:
        description: "Modo de grabación"
        required: true
        default: "simple"
        type: choice
        options: [simple, chunked]
      title:
        description: "Título para YouTube"
        required: true
        type: string
      description:
        description: "Descripción para YouTube"
        required: false
        default: ""
        type: string
      privacy_status:
        description: "Visibilidad"
        required: true
        default: "unlisted"
        type: choice
        options: [public, unlisted, private]
      scheduled_at:
        description: "Fecha ISO 8601 opcional"
        required: false
        default: ""
        type: string
      max_record_seconds:
        description: "Tiempo máximo de grabación"
        required: true
        default: "16800"
        type: string
      chunk_seconds:
        description: "Duración de cada parte"
        required: true
        default: "300"
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TIKTOK_LIVE_URL: ${{ inputs.tiktok_url }}
      MODE: ${{ inputs.mode }}
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DESCRIPTION: ${{ inputs.description }}
      PRIVACY_STATUS: ${{ inputs.privacy_status }}
      SCHEDULED_AT: ${{ inputs.scheduled_at }}
      MAX_RECORD_SECONDS: ${{ inputs.max_record_seconds }}
      CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m yt_dlp --version

      - name: Check TikTok URL
        run: |
          PYTHONPATH=scripts python -c "
          import os
          from tiktok_live_capture import validate_tiktok_url
          url = os.environ['TIKTOK_LIVE_URL']
          validate_tiktok_url(url)
          print('URL válida:')
          print(url)
          "

      - name: Record TikTok LIVE
        if: ${{ inputs.mode == 'simple' }}
        run: |
          PYTHONPATH=scripts python scripts/step_tiktok_live_simple.py

      - name: Upload to YouTube
        if: ${{ inputs.mode == 'simple' }}
        run: |
          PYTHONPATH=scripts python scripts/step_upload.py

      - name: Record and upload TikTok LIVE in parts
        if: ${{ inputs.mode == 'chunked' }}
        run: |
          PYTHONPATH=scripts python scripts/step_tiktok_live_chunked.py

      - name: Publish result
        if: always()
        run: |
          PYTHONPATH=scripts python scripts/step_publish_result.py
